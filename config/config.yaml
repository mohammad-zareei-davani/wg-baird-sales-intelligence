# W&G Baird Sales Intelligence — runtime configuration
# All analytical knobs live here; nothing is hardcoded in application code.

fx:
  eur_to_gbp: 0.85

# Keys are the form produced after lowercase, whitespace collapse, and
# slash-spacing normalisation. Values are the canonical display names
# (title-cased by the cleaner after lookup).
# Only typo / spacing variants belong here. Real product distinctions
# must never be collapsed.
product_type_normalisation:
  "brochures / price list": "Brochures / Price List"
  "leaflets to a4 / price lists": "Leaflets to A4 / Price Lists"
  "books / educational books": "Educational Books"
  "educational books": "Educational Books"
  "miscellaneous -ask advice": "Miscellaneous - Ask Advice"
  "miscellaneous-ask advice": "Miscellaneous - Ask Advice"
  "certficates": "Certificates"
  "certificates": "Certificates"

